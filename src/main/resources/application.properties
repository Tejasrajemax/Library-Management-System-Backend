spring.application.name=library-management-system

# MySQL Database Connection

spring.datasource.url = jdbc:mysql://localhost:3306/library_management
# jdbc : Java Database Conectivity
# mysql : MySQL JDBC Driver
# Localhost : Computer/Server Address
# 3306 : MySQL Port No.
# library_management : Name of Database

spring.datasource.username = root
spring.datasource.password = "DataBase Password"

# JPA / Hibernate
# Check the Java Entries and Check Databases (Compare if not match shows error)

# spring.jpa.hibernate.ddl-auto = validate

# Check And Auto Update my SQL Database by it self
spring.jpa.hibernate.ddl-auto=update


# Used to show the SQL query in the Console section that generates automatically
spring.jpa.show-sql = true

# used to show these query in cleared manner
spring.jpa.properties.hibernate.format_sql = true

# Add Payment GateWay Cashfree (Configuration)
cashfree.client-id = ${CASHFREE_CLIENT_ID}
cashfree.client-secret = ${CASHFREE_CLIENT_SECRET}
cashfree.base-url = https://sandbox.cashfree.com/pg
cashfree.api-version = 2023-08-01

# Admin ID & Password
admin.id = Tejasrajemax
# tells Spring Boot to read the Admin password from an environment variable named ADMIN_PASSWORD
admin.password = ${ADMIN_PASSWORD}

# Before run the code used to enter the Password in this Format in the Powershell like API & Secret
# $env:ADMIN_PASSWORD="YourStrongAdminPassword"
