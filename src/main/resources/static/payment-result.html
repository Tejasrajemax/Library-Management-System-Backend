
<!DOCTYPE html>
<html>
<head>
    <title>Payment Result</title>
    <meta charset="UTF-8">
    
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f7fb;
        margin: 0;
        padding: 50px 20px;
        text-align: center;
    }

    h2 {
        color: #198754;
        margin-bottom: 10px;
    }

    #message {
        color: #555;
        margin-bottom: 25px;
    }

    #receipt {
        background-color: white;
        max-width: 500px;
        margin: 25px auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: left;
    }

    #receipt h3 {
        text-align: center;
        color: #333;
        border-bottom: 1px solid #ddd;
        padding-bottom: 15px;
        margin-top: 0;
    }

    #receipt p {
        padding: 10px 0;
        border-bottom: 1px dashed #ddd;
        color: #444;
        overflow-wrap: anywhere;
    }

    button {
        background-color: #198754;
        color: white;
        border: none;
        padding: 12px 22px;
        margin: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background-color: #146c43;
    }

    @media print {
        body {
            background-color: white;
            padding: 0;
        }

        button {
            display: none;
        }

        #receipt {
            box-shadow: none;
            border: 1px solid #ddd;
        }
    }
</style>

</head>
<body>
    <h2 id="heading">Checking Your Payment...</h2>
    <p id="message">Please wait while we verify your payment.</p>

    <div id="receipt" style="display: none;">
        <h2>LIBRARY MANAGEMENT SYSTEM</h2>
        <p style="text-align: center;">Fine Payment Receipt</p>
        <h3>Payment Details</h3>
        <p>Receipt Number: <span id="receiptNumber"></span></p>
        <p>Student Name: <span id="studentName"></span></p>
        <p>Enrollment Number: <span id="enrollmentNo"></span></p>
        <p>Amount Paid: <span id="amount"></span></p>
        <p>Order ID: <span id="orderId"></span></p>
        <p>Payment Reference ID: <span id="cfPaymentId"></span></p>
        <p>Payment Status: <span id="status"></span></p>
        <p>Payment Date: <span id="paidAt"></span></p>
    </div>

    <button onclick="window.print()">
        Print Receipt
    </button>

    <button onclick="window.location.href='/student-dashboard.html'">
        Back to Dashboard
    </button>

    <script>

        async function verifyPayment() {

            const message = document.getElementById("message");

            const params = new URLSearchParams(window.location.search);

            const orderId = params.get("order_id");

            if (!orderId) {
                message.innerText = "Order ID not found.";
                return;
            }

            try {

                const response = await fetch(
                    `/payments/verify/${encodeURIComponent(orderId)}`,
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(
                        data.message || "Payment verification failed."
                    );
                }

                if (data.status === "PAID") {
    document.getElementById("heading").innerText = "Payment Successful!";
    message.innerText = "Your fine has been paid successfully.";

    document.getElementById("studentName").innerText = data.studentName;
    document.getElementById("enrollmentNo").innerText = data.enrollmentNo;
    document.getElementById("amount").innerText =
        "\u20B9" + Number(data.amount).toFixed(2);
    document.getElementById("orderId").innerText = data.orderId;
    const year = new Date(data.paidAt).getFullYear();
document.getElementById("receiptNumber").innerText =
    data.receiptNumber || "Not available";
    document.getElementById("cfPaymentId").innerText =
        data.cfPaymentId || "Not available";
    document.getElementById("status").innerText = data.status;
document.getElementById("paidAt").innerText =
    data.paidAt
        ? new Date(data.paidAt).toLocaleString("en-IN")
        : "Not available";
    document.getElementById("receipt").style.display = "block";
} else {
    message.innerText =
        "Payment is not confirmed. Current status: " + data.status;
}

            } catch (error) {

                message.innerText = error.message;
                console.error(error);

            }
        }

        verifyPayment();

    </script>

</body>
</html>
